<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — BLACK</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="index.html"><div class="logo">B</div> BLACK</a>
      <a class="btn btn-ghost" href="index.html">На главную</a>
    </nav>

    <div class="auth-grid">
      <form class="card auth-card" id="regForm">
        <h2>Регистрация</h2>
        <p class="hint">Почта и пароль. После входа можно сгенерировать номер.</p>
        <label>Имя</label>
        <input class="field" id="regName" placeholder="Как к тебе обращаться" required />
        <label>Почта</label>
        <input class="field" id="regEmail" type="email" placeholder="you@mail.com" required />
        <label>Пароль</label>
        <input class="field" id="regPass" type="password" minlength="6" placeholder="минимум 6 символов" required />
        <button class="btn btn-primary btn-block" style="margin-top:16px" type="submit">Создать аккаунт</button>
        <div class="msg" id="regMsg"></div>
      </form>

      <form class="card auth-card" id="loginForm">
        <h2>Вход</h2>
        <p class="hint">Уже есть аккаунт — заходи и управляй номерами.</p>
        <label>Почта</label>
        <input class="field" id="logEmail" type="email" required />
        <label>Пароль</label>
        <input class="field" id="logPass" type="password" required />
        <button class="btn btn-ok btn-block" style="margin-top:16px" type="submit">Войти</button>
        <div class="msg" id="logMsg"></div>
      </form>
    </div>
  </div>
  <script type="module" src="js/auth-page.js"></script>
</body>
</html>
